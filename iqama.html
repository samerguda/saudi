<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معلومات هوية مقيم - السعودية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 20px;
            color: #38bdf8;
            margin-bottom: 4px;
        }

        .header p {
            color: #94a3b8;
            font-size: 13px;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        .id-card-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .id-card {
            width: 100%;
            max-width: 340px;
            background: #fff;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            border: 3px solid #d4af37;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .id-card img {
            width: 100%;
            height: auto;
            display: block;
            transform: rotate(90deg);
            max-width: 100%;
            margin: 35px 0;
        }

        @media (max-width: 768px) {
            .id-card {
                max-width: 280px;
            }
            .id-card img {
                margin: 25px 0;
            }
        }

        .info-section {
            background: rgba(15, 23, 42, 0.7);
            border-radius: 14px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        @media (max-width: 480px) {
            .info-grid {
                grid-template-columns: 1fr;
            }
            .info-item.full-width {
                grid-column: span 1 !important;
            }
        }

        .info-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 12px;
            border-radius: 8px;
            border-right: 3px solid #38bdf8;
        }

        .info-item.full-width {
            grid-column: span 2;
        }

        .info-label {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 2px;
        }

        .info-value {
            font-size: 13px;
            font-weight: 700;
            color: #f1f5f9;
            word-break: break-word;
        }

        .countdown-container {
            margin-top: 20px;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            border-radius: 14px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 6px 15px rgba(2, 132, 199, 0.3);
        }

        .countdown-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #e0f2fe;
        }

        .countdown-timers {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .time-box {
            background: rgba(0, 0, 0, 0.25);
            padding: 8px 12px;
            border-radius: 10px;
            min-width: 55px;
        }

        .time-number {
            font-size: 18px;
            font-weight: 900;
            color: #fff;
        }

        .time-text {
            font-size: 10px;
            color: #bae6fd;
            margin-top: 2px;
        }
    </style>
</head>
